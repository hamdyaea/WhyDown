name: Publish Linux binaries

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whydown-release-main
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Check package version and existing tags
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -1)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable semantic version in Cargo.toml" >&2
            exit 1
          fi
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags --exit-code origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${tag} already exists; skipping automatic publication"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked
      - run: cargo build --release --locked
      - name: Verify demo and JSON output
        run: |
          set -euo pipefail
          ./target/release/whydown demo --format json > demo.json
          python3 -m json.tool demo.json >/dev/null
          python3 - <<'PY'
          import json
          data = json.load(open('demo.json', encoding='utf-8'))
          import re
          expected = re.search(r'^version = "([^"]+)"', open('Cargo.toml', encoding='utf-8').read(), re.M).group(1)
          assert data['version'] == expected
          assert data['network_incidents']
          assert data['schema_version'] == 1
          PY

  build:
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install musl tools if required
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target '${{ matrix.target }}'
      - name: Package and verify archive
        shell: bash
        run: |
          set -euo pipefail
          target='${{ matrix.target }}'
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -1)"
          filename="whydown-v${version}-${target}.tar.gz"
          mkdir -p package dist
          cp "target/${target}/release/whydown" package/
          cp README.md LICENSE package/
          ./package/whydown --version | grep -Fx "whydown ${version}"
          tar -czf "dist/${filename}" -C package whydown README.md LICENSE
          ( cd dist && sha256sum "${filename}" > "${filename}.sha256" )
          ( cd dist && sha256sum -c "${filename}.sha256" )
      - uses: actions/upload-artifact@v4
        with:
          name: whydown-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [decide, test, build]
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: whydown-*
          path: dist
          merge-multiple: true
      - name: Verify all four archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 4
          test "$(find dist -maxdepth 1 -name '*.sha256' | wc -l)" -eq 4
          ( cd dist && sha256sum -c ./*.sha256 )
      - name: Create GitHub Release and vX.Y.Z tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.decide.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/*.tar.gz dist/*.sha256 \
            --target "$GITHUB_SHA" \
            --title "WhyDown $TAG" \
            --generate-notes
