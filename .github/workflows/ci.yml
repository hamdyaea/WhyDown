name: Rust CI

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run tests
        run: cargo test --all-targets
      - name: Lint
        run: cargo clippy --all-targets
      - name: Build release
        run: cargo build --release
      - name: Demo smoke test
        run: |
          ./target/release/whydown demo --format json --output example.json
          python3 -m json.tool example.json >/dev/null
          ./target/release/whydown demo --format html --output example.html
          grep -q '<!doctype html>' example.html
