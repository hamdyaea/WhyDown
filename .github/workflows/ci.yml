name: Rust CI

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run tests
        run: cargo test --all-targets --locked
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build release
        run: cargo build --release --locked
      - name: Validate Debian package and AUR recipes
        shell: bash
        run: |
          set -euo pipefail
          bash -n packaging/deb/build-deb.sh
          bash -n packaging/aur/whydown/PKGBUILD
          bash packaging/deb/build-deb.sh ./target/release/whydown /tmp/whydown-ci-deb
          ( cd /tmp/whydown-ci-deb && sha256sum -c ./*.sha256 )
          ! grep -Eq '  /' /tmp/whydown-ci-deb/*.sha256
          dpkg-deb --info /tmp/whydown-ci-deb/*.deb
          dpkg-deb --contents /tmp/whydown-ci-deb/*.deb | grep -F '/usr/share/applications/whydown.desktop'
      - name: Interactive TUI pseudo-terminal smoke test
        run: python3 tests/tui_pty_smoke.py ./target/release/whydown
      - name: GUI model tests (no display needed)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Qt6 desktop GUI mouse-selection smoke test on Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt6 xvfb
          xvfb-run -a python3 tests/gui_xvfb_smoke.py ./target/release/whydown
      - name: Guided installer smoke test (no network)
        run: sh tests/install_smoke.sh
      - name: Demo smoke test
        run: |
          ./target/release/whydown demo --format json --output example.json
          python3 -m json.tool example.json >/dev/null
          python3 - <<'PY'
          import json
          with open('example.json', encoding='utf-8') as f:
              report = json.load(f)
          assert report['schema_version'] == 2
          assert report['summary']['active_connectivity_probed'] is False
          assert all('scope' in finding for finding in report['findings'])
          assert any(e['subject'] == 'wlan0' for e in report['timeline'])
          PY
          ./target/release/whydown demo --format html --output example.html
          grep -q '<!doctype html>' example.html
